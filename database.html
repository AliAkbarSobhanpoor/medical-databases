<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Medical Database | پایگاه داده پزشکی</title>
    <link rel="icon" href="data:," />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&family=Source+Serif+4:wght@600;700&display=swap"
    />
    <link rel="stylesheet" href="styles/index.css" />
  </head>
  <body class="bg-page font-sans leading-[1.8] text-ink">
    <header
      class="flex items-center justify-between border-b-[3px] border-gold bg-navy px-[clamp(1rem,4vw,3rem)] py-[0.7rem] text-white"
    >
      <a
        class="flex items-center gap-[0.6rem] text-[1.1rem] font-bold"
        href="index.html"
      >
        <i class="text-gold not-italic">✚</i><span id="brand"></span>
      </a>
      <div
        class="flex gap-2 [&_b]:font-normal [&_b]:opacity-55 [&_b.on]:font-bold [&_b.on]:text-gold [&_b.on]:opacity-100"
      >
        <button
          id="lang"
          class="cursor-pointer rounded-[0.4rem] border border-white/35 px-[0.8rem] py-[0.3rem] hover:border-gold"
        ></button>
        <button
          id="theme"
          aria-label="Theme"
          class="cursor-pointer rounded-[0.4rem] border border-white/35 px-[0.8rem] py-[0.3rem] hover:border-gold"
        ></button>
      </div>
    </header>

    <main id="main" class="mx-auto max-w-[900px] px-4 pt-12 pb-16"></main>

    <footer
      id="foot"
      class="border-t border-line p-6 text-center text-[0.85rem] text-mute"
    ></footer>

    <button
      id="totop"
      aria-label="Back to top"
      class="invisible fixed end-[1.2rem] bottom-[1.2rem] size-12 translate-y-[10px] cursor-pointer rounded-full border-2 border-gold bg-navy text-[1.4rem] leading-none text-gold opacity-0 transition-[opacity,translate,visibility] duration-[250ms] hover:bg-gold hover:text-navy motion-reduce:transition-none [&.show]:visible [&.show]:translate-y-0 [&.show]:opacity-100"
    >
      ↑
    </button>

    <!-- Convert Markdown files into HTML. -->
    <script
      src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"
      defer
    ></script>

    <!-- Sanitize generated HTML to reduce XSS risks. -->
    <script
      src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"
      defer
    ></script>
    <script src="scripts/common.js" defer></script>
    <script src="scripts/database.js" defer></script>
  </body>
</html>

<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Medical Database Directory | مرجع پایگاه‌های داده پزشکی</title>
    <meta
      name="description"
      content="Search curated medical databases by category: PubMed, MedlinePlus, Cochrane, Scopus and more."
    />
    <link rel="icon" href="data:," />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&family=Source+Serif+4:wght@600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="styles/index.css" />
  </head>
  <body class="bg-page font-sans leading-[1.8] text-ink">
    <header
      class="flex items-center justify-between border-b-[3px] border-gold bg-navy px-[clamp(1rem,4vw,3rem)] py-[0.7rem] text-white"
    >
      <a
        class="flex items-center gap-[0.6rem] text-[1.1rem] font-bold"
        href="index.html"
      >
        <i class="text-gold not-italic">✚</i><span id="brand"></span>
      </a>

      <div class="flex items-center gap-2">
        <!-- Project repository -->
        <a
          href="https://github.com/AliAkbarSobhanpoor/medical-databases"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub repository"
          title="GitHub repository"
          class="relative z-10 flex items-center justify-center rounded-[0.4rem] border border-white/35 p-[0.45rem] hover:border-gold hover:text-gold"
        >
          <i class="fa-brands fa-github text-xl" aria-hidden="true"></i>
        </a>

        <!-- Contributors page -->
        <a
          href="contributors.html"
          aria-label="Project contributors"
          title="Project contributors"
          class="relative z-10 flex items-center justify-center rounded-[0.4rem] border border-white/35 p-[0.45rem] hover:border-gold hover:text-gold"
        >
          <i class="fa-solid fa-users text-xl" aria-hidden="true"></i>
        </a>
        <!-- Language and theme controls -->
        <div
          class="flex gap-2 [&_b]:font-normal [&_b]:opacity-55 [&_b.on]:font-bold [&_b.on]:text-gold [&_b.on]:opacity-100"
        >
          <button
            id="lang"
            class="cursor-pointer rounded-[0.4rem] border border-white/35 px-[0.8rem] py-[0.3rem] hover:border-gold"
          ></button>
          <button
            id="theme"
            aria-label="Theme"
            class="cursor-pointer rounded-[0.4rem] border border-white/35 px-[0.8rem] py-[0.3rem] hover:border-gold"
          ></button>
        </div>
      </div>
    </header>

    <section
      class="hero-bg relative overflow-hidden px-4 pt-[clamp(3rem,10vw,6rem)] pb-10 text-center text-white"
    >
      <h1
        id="title"
        class="relative mb-[1.6rem] text-[length:clamp(1.9rem,5vw,3.4rem)] leading-[1.3] font-extrabold"
      ></h1>
      <input
        id="q"
        type="search"
        autocomplete="off"
        aria-label="Search"
        class="relative w-[min(560px,92%)] rounded-full border-2 border-transparent bg-white px-[1.2rem] py-[0.9rem] text-[#12263a] focus:border-gold"
      />
      <nav
        id="cats"
        aria-label="Categories"
        class="relative mx-auto mt-5 flex max-w-[900px] flex-wrap justify-center gap-2 px-4"
      ></nav>
      <svg
        class="mx-auto mt-10 block h-[70px] w-[min(640px,90%)] opacity-80"
        viewBox="0 0 600 80"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <path
          d="M0 40h180l12-26 18 54 14-48 10 20h366"
          class="animate-ecg fill-none stroke-gold stroke-2 [stroke-dasharray:900] [stroke-dashoffset:900] motion-reduce:animate-none motion-reduce:[stroke-dashoffset:0]"
        />
      </svg>
    </section>

    <main id="grid" class="mx-auto my-10 max-w-[1100px] px-4"></main>
    <p id="none" hidden class="text-center text-mute"></p>
    <footer
      id="foot"
      class="border-t border-line p-6 text-center text-[0.85rem] text-mute"
    ></footer>

    <script src="scripts/common.js" defer></script>
    <script src="scripts/index.js" defer></script>
  </body>
</html>
